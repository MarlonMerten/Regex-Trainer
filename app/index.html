<!-- ============ Kopfleiste ============ -->
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">.*</div>
      <div class="brand-name">Regex Trainer <span>· Data Science</span></div>
    </div>

    <nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>

    <div class="top-actions">
      <div class="ring" id="ring" title="Fortschritt" role="progressbar" aria-label="Gesamtfortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
          <defs>
            <linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--accent)"/>
              <stop offset="100%" stop-color="var(--accent-2)"/>
            </linearGradient>
          </defs>
          <circle class="bg" cx="17" cy="17" r="14"/>
          <circle class="fg" id="ring-fg" cx="17" cy="17" r="14" stroke-dasharray="88" stroke-dashoffset="88"/>
        </svg>
        <span class="n" id="ring-n" aria-hidden="true">0</span>
      </div>
      <span class="sr-only" id="ring-live" aria-live="polite"></span>
      <button class="icon-btn" id="help-btn" type="button" title="Tastaturkürzel (?)" aria-label="Tastaturkürzel anzeigen" aria-controls="keyboard-help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.5-1.5 1.2-1.5 2.2"/><path d="M12 17h.01"/>
        </svg>
      </button>
      <button class="icon-btn" id="export-btn" type="button" title="Fortschritt exportieren" aria-label="Fortschritt exportieren">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
      </button>
      <button class="icon-btn" id="import-btn" type="button" title="Fortschritt importieren" aria-label="Fortschritt importieren">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21V9m0 0 4 4m-4-4-4 4"/><path d="M4 7v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7"/>
        </svg>
      </button>
      <button class="icon-btn" id="theme-btn" type="button" title="Design wechseln" aria-label="Design wechseln"></button>
      <button class="icon-btn" id="reset-btn" type="button" title="Fortschritt zurücksetzen" aria-label="Fortschritt zurücksetzen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/>
        </svg>
      </button>
    </div>
  </div>
</header>
