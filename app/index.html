<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regex Trainer — Regex verstehen und direkt üben</title>
<meta name="description" content="Regex in kurzen, verständlichen Einheiten lernen und direkt üben — ohne Anmeldung, mit zufälligen Sessions, sofortigem Feedback und lokalem Fortschritt.">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta property="og:type" content="website">
<meta property="og:title" content="Regex Trainer — Regex endlich verstehen">
<meta property="og:description" content="Lernen, zufällig üben und Wissen testen — ohne Anmeldung und mit sofortigem Feedback.">
<meta property="og:url" content="https://regex-trainer.appwrite.network">
<meta property="og:image" content="https://regex-trainer.appwrite.network/og-preview.png">
<meta property="og:image:width" content="1731">
<meta property="og:image:height" content="909">
<meta property="og:image:alt" content="Abstrakter Lernpfad aus leuchtenden Regex-Bausteinen">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://regex-trainer.appwrite.network/og-preview.png">
<link rel="canonical" href="https://regex-trainer.appwrite.network">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6d8cff">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<a class="skip-link" href="#main-content">Zum Inhalt springen</a>

<!-- ============ Kopfleiste ============ -->
<header class="topbar">
  <div class="topbar-in">
    <button class="brand" id="home-btn" type="button" aria-label="Zur Startseite">
      <div class="brand-mark" aria-hidden="true">.*</div>
      <div class="brand-name">Regex Trainer <span>Einfach lernen</span></div>
    </button>

    <nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>

    <div class="top-actions">
      <div class="ring" id="ring" title="Fortschritt" role="progressbar" aria-label="Gesamtfortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
          <defs>
            <linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--accent)"/>
              <stop offset="100%" stop-color="var(--accent-2)"/>
            </linearGradient>
          </defs>
          <circle class="bg" cx="17" cy="17" r="14"/>
          <circle class="fg" id="ring-fg" cx="17" cy="17" r="14" stroke-dasharray="88" stroke-dashoffset="88"/>
        </svg>
        <span class="n" id="ring-n" aria-hidden="true">0</span>
      </div>
      <span class="sr-only" id="ring-live" aria-live="polite"></span>
      <button class="icon-btn" id="theme-btn" type="button" title="Design wechseln" aria-label="Design wechseln"></button>
      <details class="more-menu" id="more-menu">
        <summary class="icon-btn" title="Mehr Optionen" aria-label="Mehr Optionen"><span aria-hidden="true">•••</span></summary>
        <div class="more-popover" role="group" aria-label="Weitere Optionen">
          <button class="menu-action" id="menu-play-btn" type="button">
            <span aria-hidden="true">.*</span><span>Playground öffnen</span>
          </button>
          <button class="menu-action" id="help-btn" type="button" aria-controls="keyboard-help">
            <span aria-hidden="true">?</span><span>Tastaturhilfe</span>
          </button>
          <button class="menu-action" id="export-btn" type="button">
            <span aria-hidden="true">↓</span><span>Fortschritt exportieren</span>
          </button>
          <button class="menu-action" id="import-btn" type="button">
            <span aria-hidden="true">↑</span><span>Fortschritt importieren</span>
          </button>
          <button class="menu-action danger" id="reset-btn" type="button">
            <span aria-hidden="true">↺</span><span>Fortschritt zurücksetzen</span>
          </button>
        </div>
      </details>
    </div>
  </div>
</header>

<!-- ============ Ansichten ============ -->
<main id="main-content" tabindex="-1">
  <section class="view" id="view-start" aria-label="Start"><div class="shell"></div></section>
  <section class="view" id="view-learn" aria-label="Lernen"><div class="shell"></div></section>
  <section class="view" id="view-ref" aria-label="Nachschlagen"><div class="shell"></div></section>
  <section class="view" id="view-play" aria-label="Playground"><div class="shell"></div></section>
  <section class="view" id="view-train" aria-label="Training"><div class="shell"></div></section>
  <section class="view" id="view-quiz" aria-label="Quiz"><div class="shell"></div></section>
</main>

<!-- ============ Skripte ============ -->
<script defer src="js/engine.js"></script>
<script defer src="js/explain.js"></script>
<script defer src="js/core.js"></script>
<script defer src="js/data-reference.js"></script>
<script defer src="js/data-lessons.js"></script>
<script defer src="js/data-exercises.js"></script>
<script defer src="js/data-quiz.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/ui-start.js"></script>
<script defer src="js/ui-lessons.js"></script>
<script defer src="js/ui-reference.js"></script>
<script defer src="js/ui-playground.js"></script>
<script defer src="js/ui-trainer.js"></script>
<script defer src="js/ui-quiz.js"></script>
<script defer src="js/boot.js"></script>
</body>
</html>
