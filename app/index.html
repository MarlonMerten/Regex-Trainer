<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regex Trainer — Syntax lernen, nachschlagen, üben</title>
<meta name="description" content="Interaktiver Trainer für reguläre Ausdrücke mit Python-Semantik: Lernpfad, Nachschlagewerk, Playground, Übungen in fünf Stufen und Quiz.">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236d8cff'/><text x='16' y='23' font-size='19' font-family='monospace' font-weight='bold' fill='white' text-anchor='middle'>.*</text></svg>">
</head>
<body>

<!-- ============ Kopfleiste ============ -->
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark">.*</div>
      <div class="brand-name">Regex Trainer <span>· Data Science</span></div>
    </div>

    <nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>

    <div class="top-actions">
      <div class="ring" id="ring" title="Fortschritt">
        <svg width="34" height="34" viewBox="0 0 34 34">
          <defs>
            <linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--accent)"/>
              <stop offset="100%" stop-color="var(--accent-2)"/>
            </linearGradient>
          </defs>
          <circle class="bg" cx="17" cy="17" r="14"/>
          <circle class="fg" id="ring-fg" cx="17" cy="17" r="14" stroke-dasharray="88" stroke-dashoffset="88"/>
        </svg>
        <span class="n" id="ring-n">0</span>
      </div>
      <button class="icon-btn" id="theme-btn" type="button" title="Design wechseln"></button>
      <button class="icon-btn" id="reset-btn" type="button" title="Fortschritt zurücksetzen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- ============ Ansichten ============ -->
<main>
  <section class="view" id="view-learn"><div class="shell"></div></section>
  <section class="view" id="view-ref"><div class="shell"></div></section>
  <section class="view" id="view-play"><div class="shell"></div></section>
  <section class="view" id="view-train"><div class="shell"></div></section>
  <section class="view" id="view-quiz"><div class="shell"></div></section>
</main>

<!-- ============ Skripte ============ -->
<script src="js/engine.js"></script>
<script src="js/explain.js"></script>
<script src="js/core.js"></script>
<script src="js/data-reference.js"></script>
<script src="js/data-lessons.js"></script>
<script src="js/data-exercises.js"></script>
<script src="js/data-quiz.js"></script>
<script src="js/store.js"></script>
<script src="js/ui-lessons.js"></script>
<script src="js/ui-reference.js"></script>
<script src="js/ui-playground.js"></script>
<script src="js/ui-trainer.js"></script>
<script src="js/ui-quiz.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
